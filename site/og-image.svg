<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ADLC Manifesto: governed delivery and continuous learning</title>
  <desc id="desc">Requirements Quality Gate, Implement, Review, Test, Deploy, Operate, Improve, and a return to the requirements gate. Orchestration spans every stage.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1859a9"/></marker>
    <marker id="learning" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28705d"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#fff"/>
  <rect width="1200" height="8" fill="#1859a9"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="68" font-size="40" font-weight="700" fill="#182124">ADLC Manifesto</text>
    <text x="52" y="106" font-size="23" fill="#465157">SDLC evolves. Human accountability remains.</text>
    <text x="52" y="148" font-size="20" font-weight="700" fill="#28705d">No implementation starts without a passed requirements quality gate.</text>
    <g fill="none" stroke="#1859a9" stroke-width="3" marker-end="url(#arrow)">
      <path d="M286 248H328"/><path d="M572 248H614"/><path d="M858 248H900"/>
      <path d="M1027 306V347"/><path d="M910 415H868"/>
    </g>
    <g fill="none" stroke="#28705d" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#learning)">
      <path d="M624 415H582"/><path d="M338 415H169V316"/>
    </g>
    <text x="52" y="465" font-size="16" fill="#28705d">Next increment</text>
    <g transform="translate(52 190)">
      <rect width="234" height="116" rx="5" fill="#eff7f3" stroke="#28705d" stroke-width="1.5"/>
      <text x="15" y="25" font-size="15" font-weight="700" fill="#28705d">00</text>
      <text x="15" y="51" font-size="24" font-weight="700" fill="#182124">Requirements</text>
      <text x="15" y="76" font-size="24" font-weight="700" fill="#182124">Quality Gate</text>
      <text x="15" y="100" font-size="16" fill="#465157">Human approval</text>
    </g>
    <g transform="translate(338 190)">
      <rect width="234" height="116" rx="5" fill="#f4f7fb" stroke="#bac9d8" stroke-width="1.5"/>
      <text x="15" y="25" font-size="15" font-weight="700" fill="#1859a9">01</text>
      <text x="15" y="65" font-size="24" font-weight="700" fill="#182124">Implement</text>
      <text x="15" y="100" font-size="16" fill="#465157">Approved requirements</text>
    </g>
    <g transform="translate(624 190)">
      <rect width="234" height="116" rx="5" fill="#f4f7fb" stroke="#bac9d8" stroke-width="1.5"/>
      <text x="15" y="25" font-size="15" font-weight="700" fill="#1859a9">02</text>
      <text x="15" y="65" font-size="24" font-weight="700" fill="#182124">Review</text>
      <text x="15" y="100" font-size="16" fill="#465157">Expert review</text>
    </g>
    <g transform="translate(910 190)">
      <rect width="234" height="116" rx="5" fill="#f4f7fb" stroke="#bac9d8" stroke-width="1.5"/>
      <text x="15" y="25" font-size="15" font-weight="700" fill="#1859a9">03</text>
      <text x="15" y="65" font-size="24" font-weight="700" fill="#182124">Test</text>
      <text x="15" y="100" font-size="16" fill="#465157">Evidence and validation</text>
    </g>
    <g transform="translate(910 357)">
      <rect width="234" height="116" rx="5" fill="#f4f7fb" stroke="#bac9d8" stroke-width="1.5"/>
      <text x="15" y="25" font-size="15" font-weight="700" fill="#1859a9">04</text>
      <text x="15" y="65" font-size="24" font-weight="700" fill="#182124">Deploy</text>
      <text x="15" y="100" font-size="16" fill="#465157">Release approval</text>
    </g>
    <g transform="translate(624 357)">
      <rect width="234" height="116" rx="5" fill="#f4f7fb" stroke="#bac9d8" stroke-width="1.5"/>
      <text x="15" y="25" font-size="15" font-weight="700" fill="#1859a9">05</text>
      <text x="15" y="65" font-size="24" font-weight="700" fill="#182124">Operate</text>
      <text x="15" y="100" font-size="16" fill="#465157">Human oversight</text>
    </g>
    <g transform="translate(338 357)">
      <rect width="234" height="116" rx="5" fill="#eff7f3" stroke="#28705d" stroke-width="1.5"/>
      <text x="15" y="25" font-size="15" font-weight="700" fill="#28705d">06</text>
      <text x="15" y="65" font-size="24" font-weight="700" fill="#182124">Improve</text>
      <text x="15" y="100" font-size="16" fill="#465157">Learning and revalidation</text>
    </g>
    <path d="M52 501H1144" stroke="#b8c4ca"/>
    <text x="52" y="540" font-size="25" font-weight="700" fill="#182124">Orchestrate across every stage</text>
    <text x="52" y="572" font-size="20" fill="#465157">Agents, shared skills, policies, permissions, and traceable evidence.</text>
    <text x="1144" y="607" text-anchor="end" font-size="18" fill="#465157">adlcmanifesto.org</text>
  </g>
</svg>
